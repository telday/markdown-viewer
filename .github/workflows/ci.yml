name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality gates
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          # The bundle step derives CFBundleVersion from the commit count,
          # which a shallow checkout cannot count.
          fetch-depth: 0

      # Package.swift is swift-tools-version 6.0, which needs Xcode 16+.
      # Select the newest Xcode present rather than hard-coding a point version.
      - name: Select latest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi

      - name: Show toolchain
        run: swift --version

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Runs lint, vet, unit tests, integration tests, and the coverage gate.
      - name: make check
        run: make check

      # The shippability gate: assemble the real universal, ad-hoc-signed
      # bundle and assert its finished shape. See scripts/verify-bundle.sh.
      - name: make bundle && make verify-bundle
        run: make bundle && make verify-bundle
